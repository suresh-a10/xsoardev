script: |2-



  demisto.executeCommand('setIncident',{ 'owner':"",'cdincidentstate':"New",'cdassignmentgroup':"L1 Analyst",
                                          'snowcategory':"Central-Security",'notesselection':"Work Notes",
                                          'snowstate':"New",'snowcompany':"CCBPI",'snowcaller':"web_ccbpi_demisto_dynamics",
                                          'snowbusinessservice':"SOC",'snowshortdescription':"Creating ITSM Incident In ServiceNow"})


  Response_SLA = [45,60,120,480]
  Notification_SLA = [60,90,240,480]
  Resolution_SLA = [240,960,1800,2880]


  Magnitude_SLA={10:[45,60,240],9:[60,90,960],8:[60,90,960],7:[120,240,1800],6:[120,240,1800],5:[120,240,1800],
                 4:[480,480,2800],3:[480,480,2800],2:[480,480,2800],1:[480,480,2800],0:[480,480,2800]}

  now = datetime.utcnow()
  now = now.strftime("%Y-%m-%d %H:%M:%S")
  now = datetime.strptime(now,"%Y-%m-%d %H:%M:%S")
  print("Now Time: ",now)


  #current_time = datetime.datetime.now()
  newtime = now.strftime('%Y-%m-%dT%H:%M:%S+00:00')


  inc_data = demisto.incidents()[0]

  custom_fields = inc_data.get("CustomFields",{})

  magnitude = custom_fields.get("cdsmagnitude")


  def set_fields(sla):

      demisto.executeCommand("setIncident",{'sla': sla[0]  , "slaField":"cdresponsesla"})
      demisto.executeCommand("setIncident",{'sla': sla[1] , "slaField":"cdresolvergroupnotificationsla"})
      demisto.executeCommand("setIncident",{'sla': sla[2] , "slaField":"cdresolutionsla"})
      demisto.executeCommand("setIncident",{"snowurgency":'1 - High',"snowimpact":'1 - High',"severity":'Critical',"cdpriority":'P1',
                                            "cdexpectedresponsesla":sla[0],"cdexpectedresolvergroupnotificationsla":sla[1],"cdexpectedresolutionsla":sla[2]})
      demisto.executeCommand('startTimer',{ 'timerField':'cdresponsesla' })
      demisto.executeCommand('startTimer',{ 'timerField':'cdresolvergroupnotificationsla' })

  if magnitude == 10:

      sla=Magnitude_SLA[magnitude]
      set_fields(sla)
  elif magnitude==9 or magnitude==8:
      sla=Magnitude_SLA[magnitude]
      set_fields(sla)
  elif magnitude>=5 and magnitude<=7:
      sla=Magnitude_SLA[magnitude]
      set_fields(sla)
  elif magnitude>=0 and magnitude<=4:
      sla=Magnitude_SLA[magnitude]
      set_fields(sla)
  else:
      demisto.executeCommand("setIncident",{"severity":'Informational'})
      demisto.executeCommand('startTimer',{ 'timerField':'cdresponsesla' })
      demisto.executeCommand('startTimer',{ 'timerField':'cdresolvergroupnotificationsla' })

  demisto.results(True)
