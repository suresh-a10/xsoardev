dockerimage: demisto/python3:3.7.3.286
enabled: true
engineinfo: {}
mainengineinfo: {}
name: CD_QradarAutomaticClosure_PROD_Ver1
pswd: ""
runas: DBotWeakRole
runonce: false
script: |
  args_sev =  demisto.args().get('new')
  #demisto.results(args_sev)
  #args_sev = "Yes"
  closing_reason_mapping = {
  "False-Positive" : "False-Positive, Tuned",
  "True-Positive" : "True Positive -  Required Action Taken",
  "Benign True-Positive" : "True Positive -  Required Action Taken",
  "Duplicate True-Positive" : "Duplicate",
  "Duplicate False-Positive" : "Duplicate",
  "Duplicate Benign True-Positive" : "Duplicate"
  }

  if args_sev == "Yes":
      inc_data = demisto.incidents()[0]
      custom_fields = inc_data.get("CustomFields",{})
      magnitude = custom_fields.get("cdsmagnitude")
      #demisto.results(inc_data)
      #qradar_data = inc_data.get("labels")
      #print(inc_data.get('closeNotes'),inc_data.get('owner'),inc_data.get('closeReason'))
      #demisto.results(type(qradar_data))
      '''qradar_updated = {}
      for item in qradar_data:
          qradar_updated[item['type']] = item['value']'''
      #Get the Offense ID
      qradar_id = custom_fields.get('cdssourceincidentid')
      #print(qradar_id)

      #Convert the Closing reason to Qradar Offense reason & get the closing reason id.
      close_reason = custom_fields.get('cdclosereason')
      if close_reason is None or close_reason == "":
          demisto.results("Please fill the appropriate Close reason. Qradar Offense in not Closed")
      else:
          if magnitude < 8:
                  #print("hi")
                  demisto.executeCommand("setIncident",{"cdresolvergroupnotificationslaapplicability":"Not Applicable"})
          else:
              pass
          #print(closing_reason_mapping[str(close_reason)])
          close_reason_map = closing_reason_mapping[str(close_reason)]
          closing_reason_filter="text=\'{close}\'".format(close=close_reason_map)
          #print(closing_reason_filter,type(closing_reason_filter))
          res = demisto.executeCommand("qradar-get-closing-reasons", {"filter":closing_reason_filter,"using":"AUS-Customer-CCBP_QRadar v3"})
          #print(res)
          if len(res[0]["Contents"]) != 0:
              demisto.results("Closing reason Found")
              closing_reason_id = res[0]["Contents"][0]["id"]
          else:
              demisto.results("Closing reason Not Found")
              closing_reason_filter="text=\'{close}\'".format(close="Resolved")
              #print(closing_reason_filter,type(closing_reason_filter))
              res = demisto.executeCommand("qradar-get-closing-reasons", {"filter":closing_reason_filter,"using":"AUS-Customer-CCBP_QRadar v3"})
              closing_reason_id = res[0]["Contents"][0]["id"]

          #print(closing_reason_id)

          #Creating a Closure Notes
          text = '''\
          The offense is closed from demisto by {user}
          Offense CLose Reason: {close_reason}
          Offense Closure Notes: {closure_notes}\
          '''.format(user=str(custom_fields.get('cdincidentowner'))+"@infosys.com", close_reason=close_reason, closure_notes=custom_fields.get('cdclosenotes'))

          res = demisto.executeCommand("qradar-create-note", {"offense_id": qradar_id,"note_text":text, "using":"AUS-Customer-CCBP_QRadar v3"})
          demisto.results(res)

          #Closing the Offense in Qradar also
          demisto.executeCommand("qradar-update-offense", {"offense_id":qradar_id,"status":"CLOSED", "closing_reason_id":closing_reason_id,"using":"AUS-Customer-CCBP_QRadar v3"})
          demisto.results(res)

  else:
      pass
  #custom_fields = inc_data.get("CustomFields",{})
scripttarget: 0
subtype: python3
