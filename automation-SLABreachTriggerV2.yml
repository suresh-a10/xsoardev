script: |
  # This script will complete tasks with the timerbreach tag value upon timer breach
  # Add this as the script to run upon breach on the given timer field.
  # Playbook tasks to complete need to be tagged timerbreach.

  inc = demisto.incidents()[0].get("id")
  demisto.results(demisto.executeCommand("taskComplete", {"id":"userreply", "incidentId": inc}))
  #demisto.results(demisto.executeCommand("taskComplete", {"id":"completedemosla", "incidentId": inc}))
  demisto.results(demisto.executeCommand("stopTimer", {"timerField":"demoslatimer","incidentId": inc}))
