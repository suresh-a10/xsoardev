comment: Entry widget that shows the number of techniques that were already handled
  by the CoA playbooks.
commonfields:
  id: EntryWidgetCoAHandled
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 6.5.0
    itemVersion: 1.0.7
    packID: MITRECoA
    packName: MITRE ATT&CK - Courses of Action
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    toServerVersion: ""
dockerimage: demisto/python3:3.11.10.115186
enabled: true
engineinfo: {}
mainengineinfo: {}
name: EntryWidgetCoAHandled
pswd: ""
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('EntryWidgetCoAHandled', 'start', __line__())
  demisto.debug('pack name = MITRE ATT&CK - Courses of Action, pack version = 1.0.7')



  incident = demisto.incident()
  count = len(incident.get('CustomFields', {}).get('techniqueslist', "").split(","))
  handled = incident.get('CustomFields', {}).get('handledtechniques', [])
  stats = len([h for h in handled if h])

  data = {
      "Type": 17,
      "ContentsFormat": "number",
      "Contents": {
          "stats": stats,
          "params": {
              "layout": "horizontal",
              "name": "Handled Techniques",
              "sign": "",
              "colors": {
                  "items": {
                      "#00CD33": {
                          "value": count - 50
                      },
                      "#FF9000": {
                          "value": count - 150
                      },
                      "#FF1744": {
                          "value": 0
                      }
                  }
              },
              "type": "above"
          }
      }
  }

  return_results(data)

  register_module_line('EntryWidgetCoAHandled', 'end', __line__())
scripttarget: 0
subtype: python3
system: true
tags:
- dynamic-section
type: python
