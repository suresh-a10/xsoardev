script: |
  import json

  SOCQ03Sub=2500
  def List_Extract(listData):
      # try:
      data = listData.split('//')
      output_list=[]
      for item in data:
          entry=json.loads(item)
          output_list.append({'PeakEPS': entry['PeakEPS'], 'showTime': entry['showTime']})
      return json.dumps(output_list)

  def transform_data(input_data,subscribe):
      line_widget= LineWidget()
      output_data = []
      for item in input_data:

          line_widget.add_category(name=item["showTime"],number=int(item["PeakEPS"]), group="PeakEPS")
          line_widget.add_category(name=item["showTime"],number=int(subscribe), group="Base Line EPS")

      return_results(line_widget)

  def SOCQ3Today():
      getList = "["+str(demisto.executeCommand("getList", {"listName":"SOCQ3List"})[0]["Contents"])+"]"
      #data = json.loads(List_Extract(getList))
      data=json.loads(getList)
      N_Data = []
      for item in data:
          N_Item = {'PeakEPS': item['PeakEPS'],
                      'showTime': item['showTime'].split(' ')[1]}
          N_Data.append(N_Item)
      return transform_data(N_Data,SOCQ03Sub)


  def main():
      SOCQ3Today()

  if __name__ in ('__main__', '__builtin__', 'builtins'):
      main()
