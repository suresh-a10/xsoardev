description: The CyberArk Application Identity Manager (AIM) provides a secure safe
  in which to store your account credentials. Use this integration to retrieve the
  account credentials in CyberArk AIM.
detaileddescription: "### Partner Contributed Integration\n#### Integration Author:
  CyberArk\nSupport and maintenance for this integration are provided by the author.
  Please use the following contact details:\n- **Email**: [https://www.cyberark.com/services-support/technical-support-contact/](mailto:https://www.cyberark.com/services-support/technical-support-contact/)\n-
  **URL**: [https://www.cyberark.com/products/secrets-management/](https://www.cyberark.com/products/secrets-management/)\n***\n##
  CyberArk CCP\nThe CyberArk Central Credential Provider (CCP) for credential management.\nUse
  it to store your passwords and other sensitive information and use them for authentication.\n\nPlease
  notice that currently the **username** and **password** in the integration are optional
  and used in\n order to perform windows authentication.\n \n\n---\n[View Integration
  Documentation](https://xsoar.pan.dev/docs/reference/integrations/cyber-ark-aim-v2)"
display: CyberArk AIM v2 (Partner Contribution)
