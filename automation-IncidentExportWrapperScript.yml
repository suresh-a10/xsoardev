  from typing import Dict, Any
  import traceback
  import json


  def core_api_post(URI,BODY,FILE_NAME):

      results=demisto.executeCommand("core-api-post", {"uri":URI,"body":json.loads(BODY)})[0]['Contents']['response']

      if results['total'] > 0 and len(results['data']) >0:
              demisto.results(demisto.executeCommand("ExportToCSV", {"fileName":FILE_NAME,"csvArray":results['data'],"headers":"id,name"}))
      else:
          demisto.results("No incidents were found !!!")
      return_results(CommandResults(
      readable_output=tableToMarkdown("Incident Data",{"Total":results['total'],"Data":len(results['data'])}),
      outputs_prefix="IncidentData",
      outputs={"Total":results['total'],"Data":len(results['data'])}
      ))

  def main():
      try:
          args=demisto.args()
          URI=args.get("uri")
          BODY=args.get("body")
          FILE_NAME=args.get("filename")

          incident_data=core_api_post(URI,BODY,FILE_NAME)

      except Exception as ex:
          demisto.error(traceback.format_exc())  # print the traceback
          return_error(f'Failed to execute BaseScript. Error: {str(ex)}')


  ''' ENTRY POINT '''


  if __name__ in ('__main__', '__builtin__', 'builtins'):
      main()

