args:
- description: The Incident IDs to reassign, can be a comma separated list (e.g. 1,2,3,4).
  name: incident_id
  required: true
comment: |-
  Randomly assigns the incidents to users on call (requires shift management) and users on call.
  See for more information: [Cortex XSOAR 6.13](https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/6.13/Cortex-XSOAR-Administrator-Guide/Shift-Management) [Cortex XSOAR 8 Cloud](https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8/Cortex-XSOAR-Cloud-Documentation/Manage-roles-in-the-Cortex-XSOAR-tenant) [Cortex XSOAR 8.7 On-prem](https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8.7/Cortex-XSOAR-On-prem-Documentation/Manage-roles-in-the-Cortex-XSOAR-tenant)
  Incident IDs should be passed as a comma-separated list.

  This automation runs using the default Limited User role, unless you explicitly change the permissions.
  For more information, see the section about permissions here:
  - For Cortex XSOAR 6 see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/6.x/Cortex-XSOAR-Playbook-Design-Guide/Automations - For Cortex XSOAR 8 Cloud see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8/Cortex-XSOAR-Cloud-Documentation/Create-a-script - For Cortex XSOAR 8.7 On-prem see https://docs-cortex.paloaltonetworks.com/r/Cortex-XSOAR/8.7/Cortex-XSOAR-On-prem-Documentation/Create-a-script
commonfields:
  id: AssignToNextShift
  version: -1
contentitemexportablefields:
  contentitemfields:
    definitionid: ""
    fromServerVersion: 6.0.0
    itemVersion: 1.1.7
    packID: ShiftManagement-AssignToNextShift
    packName: Shift Management - Assign to Next Shift
    packPropagationLabels:
    - all
    prevname: ""
    propagationLabels: []
    toServerVersion: ""
dockerimage: demisto/python3:3.11.10.115186
enabled: true
engineinfo: {}
mainengineinfo: {}
name: AssignToNextShift
pswd: ""
runas: DBotWeakRole
runonce: false
script: |
  register_module_line('AssignToNextShift', 'start', __line__())
  demisto.debug('pack name = Shift Management - Assign to Next Shift, pack version = 1.1.7')



  # check if we have any users on call to assign to
  users_on_call = demisto.executeCommand("getUsers", {"onCall": "true"})[0]['Contents']

  # if we don't have on shift users, return error, else reassign the provided incident id's to the on-call analysts
  if not users_on_call:
      return_error("No users on shift")
  else:
      incident_id = demisto.args().get('incident_id')
      demisto.results(demisto.executeCommand("executeCommandAt", {
                      "command": "AssignAnalystToIncident", "arguments": {"onCall": "true"}, "incidents": incident_id}))

  register_module_line('AssignToNextShift', 'end', __line__())
scripttarget: 0
subtype: python3
system: true
tags: []
type: python
